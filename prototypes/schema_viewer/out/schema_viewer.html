<style>
/* Layout: a phosphor terminal. Full-bleed stage for the network, a top bar for layer and search,
   a details panel on the right (a bottom sheet on a phone). One deliberate dark look, as the author asked. */
:root {
  color-scheme: dark;
  --bg: #020604;            /* the black screen, biased a touch toward the green */
  --grid: #0b1a11;
  --ink: #9dffbe;           /* light-green tables */
  --ink-strong: #d2ffe0;
  --ink-dim: #4f9a6a;
  --ink-faint: #24563a;
  --edge: #2f7a4d;
  --panel: #050d08;
  --line: #163824;
  --warn: #ffcf6e;          /* semantic: restricted / personal data, open questions */
  --ref: #8fe3e0;           /* reference tables, a cooler green */
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --s-xs: 11px; --s-sm: 12px; --s-md: 13px; --s-lg: 16px; --s-xl: 20px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: var(--s-md); overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--ink-strong); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr minmax(0, 400px); }
.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 3; }
.brand { font-family: var(--font-mono); font-weight: 700; letter-spacing: .04em; color: var(--ink-strong); font-size: var(--s-lg); }
.brand small { font-weight: 400; color: var(--ink-dim); font-size: var(--s-xs); letter-spacing: .08em; text-transform: uppercase; margin-left: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 6px 12px; cursor: pointer; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; font-size: var(--s-xs); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tool { background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; cursor: pointer; color: var(--ink); font-size: var(--s-sm); }
.tool:hover, .seg button[aria-pressed="false"]:hover { color: var(--ink-strong); }
.search { flex: 1 1 220px; min-width: 0; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; font-family: var(--font-mono); font-size: var(--s-sm); }
.search::placeholder { color: var(--ink-faint); }
.counts { font-family: var(--font-mono); font-size: var(--s-xs); color: var(--ink-dim); font-variant-numeric: tabular-nums; margin-left: auto; }

.stage { position: relative; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.edges line { stroke: var(--edge); stroke-width: 1.2; fill: none; }
svg.edges line.sat { stroke: var(--ink-faint); stroke-dasharray: 2 3; }
svg.edges line.code { stroke: var(--ref); stroke-opacity: .5; stroke-dasharray: 1 4; }
svg.edges line.history { stroke: var(--ink-faint); stroke-dasharray: 6 4; }
svg.edges line.hop2 { stroke-opacity: .45; }
.hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-size: var(--s-xs); color: var(--ink-dim); pointer-events: none; max-width: 60ch; }
.zoom { position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
.zoom .tool { background: var(--bg); width: 34px; padding: 6px 0; text-align: center; }

.card { position: absolute; left: 0; top: 0; background: var(--bg); border: 1px solid var(--ink-dim); border-radius: 2px;
  font-family: var(--font-mono); font-size: var(--s-sm); color: var(--ink); width: max-content; min-width: 150px; max-width: 320px; cursor: pointer;
  transform-origin: 50% 50%; transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .3s; user-select: none; }
.card .hd { padding: 5px 8px 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .nm { font-weight: 600; color: var(--ink-strong); white-space: nowrap; }
.card .kd { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
.card .rows { padding: 4px 8px 6px; display: grid; gap: 1px; }
.card .row { display: grid; grid-template-columns: 32px 1fr; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .row .rl { color: var(--ink-dim); font-size: 10px; }
.card .row.g { color: var(--ink-dim); }
.card .more { color: var(--ink-dim); padding-left: 38px; }
.card .badge { margin: 0 8px 7px; display: inline-block; border: 1px dashed var(--ink-dim); border-radius: 2px; padding: 2px 6px; font-size: 10px; color: var(--ink); background: transparent; cursor: pointer; }
.card .badge:hover { border-style: solid; }
.card.hub { border: 2px solid var(--ink); box-shadow: 0 0 18px rgba(157,255,190,.08); }
.card.link { border-style: solid; border-color: var(--ink-dim); border-radius: 12px; }
.card.link .hd { border-bottom-style: dotted; }
.card.satellite, .card.audit, .card.status, .card.effectivity { border-color: var(--ink-faint); }
.card.audit, .card.status, .card.effectivity { border-style: dashed; }
.card.audit .nm, .card.status .nm, .card.effectivity .nm { color: var(--ink); }
.card.reference { border-color: var(--ref); color: var(--ref); }
.card.reference .nm { color: var(--ref); }
.card.history { border-style: dashed; }
.card.focus { border-color: var(--ink-strong); box-shadow: 0 0 0 1px var(--ink-strong), 0 0 36px rgba(157,255,190,.18); z-index: 2; }
.card.hop2 { opacity: .78; }
.card.hop2 .rows, .card.hop2 .badge, .card.compact .rows, .card.compact .badge { display: none; }
.card.compact .hd, .card.hop2 .hd { border-bottom: 0; }
.chip { display: inline-block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 5px; border: 1px solid currentColor; border-radius: 2px; }
.chip.warn { color: var(--warn); }

.panel { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; min-width: 0;
  padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel h2 { font-family: var(--font-mono); font-size: var(--s-lg); color: var(--ink-strong); margin: 0 0 6px; overflow-wrap: anywhere; text-wrap: balance; }
.panel h3 { font-size: var(--s-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim); margin: 18px 0 6px; font-weight: 600; }
.panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: var(--s-sm); }
.panel dt { color: var(--ink-dim); }
.panel dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
.panel .tbl { overflow-x: auto; }
.panel table { border-collapse: collapse; width: 100%; font-family: var(--font-mono); font-size: var(--s-xs); }
.panel td, .panel th { text-align: left; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.panel th { color: var(--ink-dim); font-weight: 400; }
.panel tr.g td { color: var(--ink-dim); }
.panel td.n { color: var(--ink-strong); white-space: nowrap; }
.panel tr.sub td { color: var(--ink-dim); font-family: var(--font-ui); font-size: var(--s-sm); padding-top: 0; line-height: 1.4; }
.panel tr.has-sub td { border-bottom: 0; }
.panel ul { margin: 0; padding-left: 16px; font-family: var(--font-mono); font-size: var(--s-xs); color: var(--ink-dim); overflow-wrap: anywhere; }
.panel .go { background: none; border: 0; border-bottom: 1px dotted var(--ink-dim); padding: 0 0 3px; line-height: 1.7; color: var(--ink); cursor: pointer; font-family: var(--font-mono); font-size: var(--s-xs); }
.panel p { margin: 6px 0; color: var(--ink); line-height: 1.5; max-width: 65ch; }
.panel .muted { color: var(--ink-dim); }
.panel .note-gen { border: 1px dashed var(--ink-faint); padding: 6px 8px; color: var(--ink-dim); font-size: var(--s-xs); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr minmax(0, 42%); }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .counts { display: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

        if (p.pin) continue; const d = Math.sqrt(p.x * p.x + p.y * p.y) + 0.01, t = p.hop === 1 ? R1 : R2;
        const f = (t - d) * 0.06; p.vx += p.x / d * f; p.vy += p.y / d * f;
      } else {
        const cen = new Map();
        for (const p of arr) { const c = cen.get(p.area) || { x: 0, y: 0, n: 0 }; c.x += p.x; c.y += p.y; c.n++; cen.set(p.area, c); }
        for (const p of arr) { const c = cen.get(p.area); p.vx += (c.x / c.n - p.x) * 0.03 - p.x * 0.004; p.vy += (c.y / c.n - p.y) * 0.03 - p.y * 0.005; }
      }
      for (const p of arr) {
        if (p.pin) { p.vx = p.vy = 0; continue; }
        const v = Math.sqrt(p.vx * p.vx + p.vy * p.vy), lim = 40 * cool + 2;
        if (v > lim) { p.vx *= lim / v; p.vy *= lim / v; }
        p.x += p.vx; p.y += p.vy; p.vx *= 0.55; p.vy *= 0.55;
      }
    }
    for (let pass = 0; pass < 80; pass++) {     // separate overlapping boxes
      let moved = false;
      for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
        const p = arr[i], q = arr[j], gap = 18;
        const ox = (p.w + q.w) / 2 + gap - Math.abs(q.x - p.x), oy = (p.h + q.h) / 2 + gap - Math.abs(q.y - p.y);
        if (ox > 0 && oy > 0) {
          moved = true;
          if (ox < oy) { const s = (q.x >= p.x ? 1 : -1) * ox / 2; if (!p.pin) p.x -= s; if (!q.pin) q.x += s; if (p.pin) q.x += s; if (q.pin) p.x -= s; }
          else { const s = (q.y >= p.y ? 1 : -1) * oy / 2; if (!p.pin) p.y -= s; if (!q.pin) q.y += s; if (p.pin) q.y += s; if (q.pin) p.y -= s; }
        }
      }
      if (!moved) break;
    }
    return P;
  }

  // ---------- render ----------
  const cards = new Map();
  let positions = new Map(), visibleEdges = [];
  function render(fit) {
    const focusId = state.focus;
    let hop;
    if (focusId) hop = neighbourhood(focusId);
    else hop = new Map(overviewSet().map(n => [n.id, 1]));
    const scaleOf = h => focusId ? (h === 0 ? 1.15 : h === 1 ? 0.85 : 0.7) : 0.8;
    const want = new Set(hop.keys());
    for (const [id, el] of cards) if (!want.has(id)) { el.remove(); cards.delete(id); }
    const items = [];
    for (const [id, h] of hop) {
      const n = N.get(id); let el = cards.get(id);
      if (!el) { el = document.createElement("div"); el.tabIndex = 0; el.dataset.id = id; world.appendChild(el); cards.set(id, el); el.style.opacity = "0"; }
      el.className = `card ${n.kind}${id === focusId ? " focus" : ""}${h === 2 ? " hop2" : ""}${!focusId && n.kind === "link" ? " compact" : ""}`;
      el.innerHTML = cardHTML(n, h);
      el.setAttribute("aria-label", `${n.id}, ${KIND[n.kind] || n.kind}`);
      const sc = scaleOf(h);
      items.push({ n, hop: h, el, sc, w: el.offsetWidth * sc, h: el.offsetHeight * sc });
    }
    const L = [];
    for (const [a, c, k] of DATA.edges) if (want.has(a) && want.has(c) && k !== "audit-fk") L.push([a, c, k]);
    positions = layout(items, L, focusId);
    for (const it of items) {
      const p = positions.get(it.n.id), el = it.el;
      el._first = el.style.opacity === "0";
      if (el._first) el.style.transition = "none";
      el.style.transform = `translate(${p.x - el.offsetWidth / 2}px, ${p.y - el.offsetHeight / 2}px) scale(${it.sc})`;
      if (el._first) { void el.offsetWidth; el.style.transition = ""; }
      el.style.opacity = "1";
    }
    visibleEdges = L.map(([a, c, k]) => ({ a, c, k, h2: (hop.get(a) === 2 || hop.get(c) === 2) }));
    drawEdges();
    if (fit) fitView();
    $("hint").textContent = focusId ? "Click a neighbour to move to it. The panel lists every column." :
      (state.layer === "vault" ? "Hubs and links, grouped by subject area. Satellites stay folded on their hub until you open one." :
        "The 31 base tables of the source and their foreign keys, grouped by schema.");
    updateNames();
  }
  function clip(p, q) {   // point where the segment from p's centre to q leaves p's box
    const dx = q.x - p.x, dy = q.y - p.y, hw = p.w / 2, hh = p.h / 2;
    const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity, 1);
    return { x: p.x + dx * t, y: p.y + dy * t };
  }
  function drawEdges() {
    let s = "";
    for (const e of visibleEdges) {
      const p = positions.get(e.a), q = positions.get(e.c); if (!p || !q) continue;
      const a = clip(p, q), c = clip(q, p);
      const cls = e.k === "sat" ? "sat" : e.k === "code" ? "code" : e.k === "history" ? "history" : "";
      s += `<line class="${cls}${e.h2 ? " hop2" : ""}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/>`;
    }
    svg.innerHTML = s;
  }

  // ---------- pan and zoom ----------
  function apply() { world.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.k})`; }
  function fitView() {
    if (!positions.size) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of positions.values()) { x0 = Math.min(x0, p.x - p.w / 2); x1 = Math.max(x1, p.x + p.w / 2); y0 = Math.min(y0, p.y - p.h / 2); y1 = Math.max(y1, p.y + p.h / 2); }
    const W = stage.clientWidth, H = stage.clientHeight, pad = 40;
    state.k = Math.max(0.15, Math.min(1.4, Math.min((W - pad * 2) / (x1 - x0 || 1), (H - pad * 2) / (y1 - y0 || 1))));
    state.tx = W / 2 - (x0 + x1) / 2 * state.k; state.ty = H / 2 - (y0 + y1) / 2 * state.k; apply();
  }
  function zoomAt(f, cx, cy) {
    const k = Math.max(0.1, Math.min(3, state.k * f)); const r = k / state.k;
    state.tx = cx - (cx - state.tx) * r; state.ty = cy - (cy - state.ty) * r; state.k = k; apply();
  }
  stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  const ptrs = new Map(); let pinch = null, dragMoved = false;
  stage.addEventListener("pointerdown", e => { if (e.target.closest(".zoom")) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); dragMoved = false; if (ptrs.size === 1) stage.classList.add("dragging"); if (ptrs.size === 2) { const [a, c] = [...ptrs.values()]; pinch = Math.hypot(a.x - c.x, a.y - c.y); } });
  stage.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); const cur = { x: e.clientX, y: e.clientY }; ptrs.set(e.pointerId, cur);
    if (ptrs.size === 2 && pinch) { const [a, c] = [...ptrs.values()]; const d = Math.hypot(a.x - c.x, a.y - c.y); const r = stage.getBoundingClientRect(); zoomAt(d / pinch, (a.x + c.x) / 2 - r.left, (a.y + c.y) / 2 - r.top); pinch = d; dragMoved = true; return; }
    const dx = cur.x - prev.x, dy = cur.y - prev.y; if (Math.abs(dx) + Math.abs(dy) > 1) dragMoved = true;
    if (dragMoved) { if (!stage.hasPointerCapture(e.pointerId)) stage.setPointerCapture(e.pointerId); state.tx += dx; state.ty += dy; apply(); }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) stage.classList.remove("dragging"); };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  $("zin").onclick = () => zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2);
  $("zout").onclick = () => zoomAt(0.8, stage.clientWidth / 2, stage.clientHeight / 2);
  $("zfit").onclick = fitView;

  // ---------- interaction ----------
  world.addEventListener("click", e => {
    if (dragMoved) return;
    const b = e.target.closest("[data-open]");
    if (b) { const id = b.dataset.open; state.open.has(id) ? state.open.delete(id) : state.open.add(id); if (state.focus !== id) state.focus = id; render(true); details(id); e.stopPropagation(); return; }
    const c = e.target.closest(".card"); if (c) go(c.dataset.id);
  });
  world.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("card")) go(e.target.dataset.id); });
  function go(id) {
    const n = N.get(id); if (!n) return;
    if (n.layer !== state.layer) setLayer(n.layer, true);
    state.focus = id; render(true); details(id);
  }
  function setLayer(l, quiet) {
    state.layer = l; $("layer-vault").setAttribute("aria-pressed", l === "vault"); $("layer-source").setAttribute("aria-pressed", l === "source");
    if (!quiet) { state.focus = null; render(true); intro(); }
  }
  $("layer-vault").onclick = () => setLayer("vault");
  $("layer-source").onclick = () => setLayer("source");
  $("overview").onclick = () => { state.focus = null; render(true); intro(); };
  function updateNames() {
    $("names").innerHTML = DATA.nodes.filter(n => n.layer === state.layer || true).map(n => `<option value="${esc(n.id)}">`).join("");
  }
  $("search").addEventListener("change", e => { const v = e.target.value.trim(); if (N.has(v)) { go(v); e.target.value = ""; } });
  $("search").addEventListener("keydown", e => {
    if (e.key !== "Enter") return; const v = e.target.value.trim().toLowerCase(); if (!v) return;
    const hit = DATA.nodes.find(n => n.id.toLowerCase() === v) || DATA.nodes.find(n => n.id.toLowerCase().includes(v));
    if (hit) { go(hit.id); e.target.value = ""; }
  });
  window.addEventListener("resize", () => fitView());

  // ---------- details panel ----------
  const LABEL = { description: "description", status: "status", ruled_in: "ruled in", defined_in: "defined in", subject_area: "subject area", concept: "concept", grain: "grain",
    label: "label", driving: "driving side", optional: "optional", optional_note: "optional, note", effectivity: "effectivity", effectivity_start: "effectivity starts",
    source_table: "source table", parent_key: "parent key", satellite_kind: "kind", split_reason: "split reason", valid_time: "business valid time",
    class: "sensitivity class", class_condition: "class, condition", key: "key", key_space: "key space", history: "history", schema: "schema",
    system_time: "source system time", audit: "audit column", catalogue: "catalogue evidence", rule: "rule", note: "note", file: "file", written_at: "written", step: "step" };
  function goBtn(id) { return N.has(id) ? `<button class="go" data-go="${esc(id)}">${esc(id)}</button>` : esc(id); }
  function details(id) {
    const n = N.get(id); const m = n.meta || {};
    let h = `<h2>${esc(n.id)}</h2><div class="chips"><span class="chip">${esc(KIND[n.kind] || n.kind)}</span>`;
    if (m.status) h += `<span class="chip">${esc(m.status)}</span>`;
    if (m.class) h += `<span class="chip${/restricted|personal/.test(m.class + (m.class_condition || "")) ? " warn" : ""}">${esc(m.class)}</span>`;
    if (m.effectivity_start === "unknown") h += `<span class="chip warn">start open</span>`;
    h += `</div>`;
    if (n.gen) h += `<p class="note-gen">Not declared. This table would be generated by rule from its parent; its columns are shown as the rule implies them, and their names are illustrative until the generator is designed.</p>`;
    h += `<dl>`;
    for (const k of Object.keys(LABEL)) if (m[k]) h += `<dt>${LABEL[k]}</dt><dd>${esc(m[k])}</dd>`;
    if (n.parent) h += `<dt>${n.layer === "source" ? "history of" : "parent"}</dt><dd>${goBtn(n.parent)}</dd>`;
    if (n.ends) h += `<dt>joins</dt><dd>${goBtn(n.ends[0])} → ${goBtn(n.ends[1])}</dd>`;
    h += `</dl>`;
    const kids = childrenOf(n.id);
    if (kids.length) h += `<h3>Satellites (${kids.length})</h3><ul>${kids.map(k => `<li>${goBtn(k.id)}${k.gen ? " <span class=\"muted\">· by rule</span>" : ""}</li>`).join("")}</ul>`;
    h += `<h3>Columns (${n.cols.length})</h3><div class="tbl"><table><thead><tr><th>column</th><th>type</th><th>key</th></tr></thead><tbody>`;
    for (const c of n.cols) {
      let note = c.note || "";
      if (c.d) note = c.d + (note ? " · " + note : "");
      if (c.g) note = note ? note + " · by rule" : "by rule";
      h += `<tr class="${c.g ? "g" : ""}${note ? " has-sub" : ""}"><td class="n">${esc(c.n)}</td><td>${esc(c.t)}</td><td>${esc(c.r)}</td></tr>`;
      if (note) h += `<tr class="sub"><td colspan="3">${esc(note)}</td></tr>`;
    }
    h += `</tbody></table></div>`;
    if (n.src && n.src.length) h += `<h3>Source columns</h3><ul>${n.src.map(s => `<li>${esc(s.n)} <span class="muted">${esc(s.t)}${Object.keys(s.f).length ? " · " + esc(Object.entries(s.f).map(kv => kv.join("=")).join(", ")) : ""}</span></li>`).join("")}</ul>`;
    const feedsFrom = DATA.nodes.filter(x => x.layer === "source" && (x.feeds || []).includes(n.id)).map(x => x.id);
    if (n.layer === "vault" && feedsFrom.length) h += `<h3>Loaded from</h3><ul>${feedsFrom.map(x => `<li>${goBtn(x)}</li>`).join("")}</ul>`;
    if (n.layer === "source" && n.feeds && n.feeds.length) h += `<h3>Feeds the raw vault (${n.feeds.length})</h3><ul>${n.feeds.map(x => `<li>${goBtn(x)}</li>`).join("")}</ul>`;
    if (n.notes && n.notes.length) h += `<h3>Notes</h3>${n.notes.map(p => `<p>${esc(p)}</p>`).join("")}`;
    if (n.ev && n.ev.length) h += `<h3>Evidence (${n.ev.length})</h3><ul>${n.ev.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    panel.innerHTML = h;
  }
  panel.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
  function intro() {
    panel.innerHTML = state.layer === "vault" ?
      `<h2>Raw vault, Wide World Importers</h2><p>The tables as declared in <code>model/</code> and ruled in ADR-0028 to ADR-0033. Hubs have a heavy border, links rounded corners, satellites a thin one; tables generated by rule (audit, status tracking, effectivity) are dashed and dimmed. Reference tables are drawn in a cooler green.</p><p class="muted">Nothing here is built. The view reads the declaration files and draws what the generator would be asked to build.</p><h3>Start from</h3><ul>${["hub_sales_order", "hub_customer", "hub_person", "hub_stock_item", "lnk_invoice__bill_to_customer"].map(x => `<li>${goBtn(x)}</li>`).join("")}</ul>` :
      `<h2>Raw source, Wide World Importers</h2><p>The source database as its own catalogue describes it, from the analysis record's catalogue evidence: 31 base tables and 17 history tables, with their keys and foreign keys. Each table's panel shows which raw-vault tables it feeds.</p><p class="muted">The audit foreign key <code>LastEditedBy</code>, present on almost every table, is left out of the drawing.</p><h3>Start from</h3><ul>${["Sales.Orders", "Sales.Customers", "Warehouse.StockItems", "Application.People"].map(x => `<li>${goBtn(x)}</li>`).join("")}</ul>`;
  }
  state.focus = "hub_sales_order";
  render(true); details("hub_sales_order");
})();
</script>

</body>
</html>
