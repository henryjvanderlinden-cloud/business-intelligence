<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 975" width="1280" height="975" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>nsdn — overview schematic (draft)</title>
  <style>
    .t   { font-size: 22px; font-weight: 700; fill: #1f2328; }
    .st  { font-size: 13px; fill: #57606a; }
    .h   { font-size: 14px; font-weight: 700; letter-spacing: .04em; fill: #1f2328; }
    .hs  { font-size: 12.5px; fill: #1f2328; }
    .b   { font-size: 12.5px; fill: #1f2328; }
    .bb  { font-size: 12.5px; font-weight: 700; fill: #1f2328; }
    .s   { font-size: 11px; fill: #57606a; }
    .sb  { font-size: 12px; font-weight: 700; fill: #1f2328; }
    .al  { font-size: 10.5px; fill: #57606a; font-style: italic; }
    .arr { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arr2{ stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#a); marker-start: url(#as); }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker>
  </defs>

  <rect width="1280" height="975" fill="#ffffff"/>

  <!-- Title -->
  <text class="t" x="20" y="38">nsdn — a generic framework for BI with an agentic layer</text>
  <text class="st" x="20" y="62">Three faculties act on one substrate of data. Every task is a chain: proposes → decides → executes → checks. Draft for discussion, 2026-09-25.</text>

  <!-- Left panel: value areas -->
  <rect x="20" y="90" width="210" height="620" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text class="h" x="34" y="114">VALUE AREAS</text>
  <text class="s" x="34" y="132">separate; the list is open</text>
  <rect class="box" x="34" y="150" width="182" height="54" rx="5"/>
  <text class="sb" x="46" y="172">Cheaper building</text>
  <text class="s" x="46" y="190">the vault-to-mart projection</text>
  <rect class="box" x="34" y="216" width="182" height="54" rx="5"/>
  <text class="sb" x="46" y="238">Metadata</text>
  <text class="s" x="46" y="256">where human catalogues fail</text>
  <rect class="box" x="34" y="282" width="182" height="70" rx="5"/>
  <text class="sb" x="46" y="304">Monitoring,</text>
  <text class="sb" x="46" y="320">troubleshooting, testing</text>
  <text class="s" x="46" y="338">diagnoses, regression tests</text>
  <rect class="box" x="34" y="364" width="182" height="54" rx="5"/>
  <text class="sb" x="46" y="386">Continuous</text>
  <text class="sb" x="46" y="402">improvement</text>
  <rect x="34" y="430" width="182" height="40" rx="5" fill="none" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text class="s" x="46" y="455">… more to be added</text>
  <text class="s" x="34" y="500">Each capability stands on</text>
  <text class="s" x="34" y="516">its own; none owes a link</text>
  <text class="s" x="34" y="532">to another.</text>

  <!-- HUMANS band -->
  <rect x="250" y="90" width="730" height="100" rx="8" fill="#fff4e5" stroke="#d4a15a"/>
  <text class="h" x="266" y="114">HUMANS</text>
  <text class="hs" x="266" y="140">set purpose · decide meaning, disputes and consequences · approve · act on insight</text>
  <text class="s" x="266" y="164">By mandate, not by risk: meaning, KPI definitions, priorities, anything irreversible or regulatory.</text>
  <text class="s" x="266" y="180">Attention is a fixed weekly budget per role.</text>

  <!-- ADJUDICATION band -->
  <rect x="250" y="222" width="730" height="114" rx="8" fill="#fdf8e1" stroke="#c9a227"/>
  <text class="h" x="266" y="246">ADJUDICATION ECONOMY</text>
  <text class="s" x="476" y="246">review only where it averts the most loss per minute of a person's time</text>
  <rect class="box" x="266" y="260" width="166" height="62" rx="5"/>
  <text class="sb" x="276" y="279">Auto-accept</text>
  <text class="s" x="276" y="296">machine-verified, reversible</text>
  <text class="s" x="276" y="311">audited by sample</text>
  <rect class="box" x="444" y="260" width="166" height="62" rx="5"/>
  <text class="sb" x="454" y="279">Accept provisionally</text>
  <text class="s" x="454" y="296">used only within an</text>
  <text class="s" x="454" y="311">enforced scope</text>
  <rect x="622" y="260" width="166" height="62" rx="5" fill="#ffffff" stroke="#d4a15a" stroke-width="1.8"/>
  <text class="sb" x="632" y="279">Human</text>
  <text class="s" x="632" y="296">decision owner, deadline,</text>
  <text class="s" x="632" y="311">and a default if silent</text>
  <rect class="box" x="800" y="260" width="166" height="62" rx="5"/>
  <text class="sb" x="810" y="279">Park</text>
  <text class="s" x="810" y="296">nothing depends on it yet;</text>
  <text class="s" x="810" y="311">visible, with an expiry</text>

  <!-- arrows humans <-> queue -->
  <path class="arr" d="M705,222 L705,192"/>
  <text class="al" x="713" y="211">only what needs a person</text>
  <path class="arr" d="M300,190 L300,220"/>
  <text class="al" x="308" y="211">rulings; a ruling on a pattern becomes a precedent</text>

  <!-- AGENTIC band -->
  <rect x="250" y="368" width="730" height="110" rx="8" fill="#eef1fd" stroke="#7b8fd8"/>
  <text class="h" x="266" y="392">AGENTIC LAYER</text>
  <text class="s" x="392" y="392">a system, not a model</text>
  <rect class="box" x="266" y="404" width="104" height="28" rx="5"/><text class="b" x="318" y="423" text-anchor="middle">heartbeat</text>
  <rect class="box" x="380" y="404" width="104" height="28" rx="5"/><text class="b" x="432" y="423" text-anchor="middle">workflows</text>
  <rect class="box" x="494" y="404" width="104" height="28" rx="5"/><text class="b" x="546" y="423" text-anchor="middle">procedures</text>
  <rect class="box" x="608" y="404" width="104" height="28" rx="5"/><text class="b" x="660" y="423" text-anchor="middle">memory</text>
  <rect class="box" x="722" y="404" width="104" height="28" rx="5"/><text class="b" x="774" y="423" text-anchor="middle">LLMs</text>
  <text class="hs" x="266" y="458">writes and explains: code, templates, metadata, tests, diagnoses — and triages its own proposals</text>

  <!-- agentic -> queue -->
  <path class="arr" d="M520,368 L520,338"/>
  <text class="al" x="528" y="357">proposes</text>

  <!-- DATA band -->
  <rect x="250" y="510" width="730" height="200" rx="8" fill="#f0f2f4" stroke="#8c959f"/>
  <text class="h" x="266" y="534">DATA — the substrate</text>
  <text class="s" x="440" y="534">run end to end by DETERMINISTIC MACHINERY · no model in the data path</text>

  <rect class="box" x="262" y="560" width="74" height="50" rx="5"/><text class="bb" x="299" y="590" text-anchor="middle">Sources</text>
  <path class="arr" d="M337,585 L348,585"/>
  <rect class="box" x="350" y="560" width="58" height="50" rx="5"/><text class="bb" x="379" y="590" text-anchor="middle">Raw</text>
  <path class="arr" d="M409,585 L420,585"/>
  <rect class="box" x="422" y="560" width="116" height="50" rx="5"/><text class="bb" x="480" y="581" text-anchor="middle">Data Vault</text><text class="s" x="480" y="598" text-anchor="middle">all data, all time</text>
  <path class="arr" d="M539,585 L550,585"/>
  <rect class="box" x="552" y="560" width="104" height="50" rx="5"/><text class="bb" x="604" y="581" text-anchor="middle">Dimensional</text><text class="bb" x="604" y="597" text-anchor="middle">marts</text>
  <path class="arr" d="M657,585 L668,585"/>
  <!-- publication gate -->
  <rect x="672" y="552" width="26" height="66" rx="3" fill="#ffffff" stroke="#b42318" stroke-width="1.8"/>
  <line x1="679" y1="558" x2="679" y2="612" stroke="#b42318" stroke-width="2"/>
  <line x1="691" y1="558" x2="691" y2="612" stroke="#b42318" stroke-width="2"/>
  <path class="arr" d="M699,585 L712,585"/>
  <rect class="box" x="714" y="560" width="104" height="50" rx="5"/><text class="bb" x="766" y="581" text-anchor="middle">Semantic</text><text class="bb" x="766" y="597" text-anchor="middle">layer</text>
  <path class="arr" d="M819,585 L830,585"/>
  <rect class="box" x="832" y="560" width="132" height="50" rx="5"/><text class="bb" x="898" y="581" text-anchor="middle">Dashboards</text><text class="s" x="898" y="598" text-anchor="middle">self-service, users</text>

  <text class="s" x="685" y="632" text-anchor="middle" fill="#b42318" style="fill:#b42318">publication gate</text>
  <text class="b" x="266" y="656">Rule versioning and lineage: any past report can be reproduced.</text>
  <text class="b" x="266" y="676">Publication gate: a mart is released only when the tests on its data version pass; a failing test blocks it.</text>
  <text class="b" x="266" y="696">Temporal behaviour and join knowledge are measured here, and tested before anything relies on them.</text>

  <!-- agentic <-> data -->
  <path class="arr" d="M320,510 L320,480"/>
  <text class="al" x="328" y="499">observes</text>
  <path class="arr" d="M640,480 L640,508"/>
  <text class="al" x="648" y="499">approved code, templates and tests — executed by machinery</text>

  <!-- CONTEXT column -->
  <rect x="1030" y="90" width="230" height="620" rx="8" fill="#e8f6f3" stroke="#3f9a8a"/>
  <text class="h" x="1044" y="114">CONTEXT SYSTEM</text>
  <text class="s" x="1044" y="132">the shared memory, and the catalogue</text>

  <text class="bb" x="1044" y="162">Assertions — the core record</text>
  <text class="s" x="1044" y="180">every claim is typed: intended,</text>
  <text class="s" x="1044" y="195">declared, implemented, observed</text>
  <text class="s" x="1044" y="210">or certified — with its status,</text>
  <text class="s" x="1044" y="225">owner and evidence</text>

  <text class="bb" x="1044" y="258">Cards — readable views</text>
  <text class="s" x="1044" y="276">one per business object, generated</text>
  <text class="s" x="1044" y="291">for people and for agents</text>

  <text class="bb" x="1044" y="324">One identity plane</text>
  <text class="s" x="1044" y="342">permanent identifiers over separate</text>
  <text class="s" x="1044" y="357">stores; access is filtered before</text>
  <text class="s" x="1044" y="372">anything is retrieved</text>

  <text class="bb" x="1044" y="405">Kept true by</text>
  <text class="s" x="1044" y="423">task-shaped retrieval · mandatory</text>
  <text class="s" x="1044" y="438">write-back · standing gardening</text>
  <text class="s" x="1044" y="453">(re-check, expire, quarantine)</text>

  <text class="bb" x="1044" y="486">Holds, among much else</text>
  <text class="s" x="1044" y="504">temporal behaviour per table and</text>
  <text class="s" x="1044" y="519">attribute · join knowledge ·</text>
  <text class="s" x="1044" y="534">the adjudication record</text>

  <text class="bb" x="1044" y="567">Catalogue for people</text>
  <text class="s" x="1044" y="585">reached only through a</text>
  <text class="s" x="1044" y="600">publication pipeline</text>

  <text class="s" x="1044" y="640">Built to grow very large while</text>
  <text class="s" x="1044" y="655">agents still find their way by</text>
  <text class="s" x="1044" y="670">identity, not by search alone.</text>

  <!-- arrows between main area and context -->
  <path class="arr" d="M1028,140 L983,140"/>
  <text class="al" x="1005" y="132" text-anchor="middle">catalogue</text>
  <path class="arr" d="M982,300 L1027,300"/>
  <text class="al" x="1005" y="292" text-anchor="middle">record</text>
  <path class="arr2" d="M984,440 L1026,440"/>
  <text class="al" x="1005" y="418" text-anchor="middle">reads,</text>
  <text class="al" x="1005" y="431" text-anchor="middle">writes</text>
  <text class="al" x="1005" y="456" text-anchor="middle">back</text>
  <path class="arr" d="M982,640 L1027,640"/>
  <text class="al" x="1005" y="632" text-anchor="middle">facts</text>

  <!-- Footer: principles -->
  <rect x="20" y="740" width="610" height="215" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text class="h" x="34" y="764">PRINCIPLES</text>
  <text class="b" x="34" y="790">• Mandate is separate from capability; models never operate in the data path; autonomy is tiered.</text>
  <text class="b" x="34" y="812">• Every accepted claim traces to evidence or to a responsible person.</text>
  <text class="b" x="34" y="834">• Where machines can check the output, the agentic layer scales; where only judgement</text>
  <text class="b" x="46" y="852">can check it, people remain the bottleneck.</text>
  <text class="b" x="34" y="874">• Human attention is the scarce resource. Reversibility plus fast detection</text>
  <text class="b" x="46" y="892">substitute for review; more review is not always less risk.</text>
  <text class="b" x="34" y="914">• Cost must not simply move elsewhere.</text>
  <text class="b" x="34" y="936">• Generic: the full design is described; every implementation starts lean and grows in stages.</text>

  <!-- Footer: open -->
  <rect x="650" y="740" width="610" height="215" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text class="h" x="664" y="764">HONESTLY OPEN</text>
  <text class="b" x="664" y="790">• The central bet: can the agentic layer propose business keys well</text>
  <text class="b" x="676" y="808">enough to be worth a person's time to check?</text>
  <text class="b" x="664" y="830">• The economics: cost per proposal, and human minutes of adjudication</text>
  <text class="b" x="676" y="848">per week. Neither is quantified.</text>
  <text class="b" x="664" y="870">• What success means for each capability.</text>
  <text class="b" x="664" y="892">• Nothing is built. Next: sandboxes on open data. There, business owners</text>
  <text class="b" x="676" y="910">and reviewers are simulated, and results must say so.</text>
</svg>
